<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>"Pemilihan Kelompok"</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Iframe dengan izin autoplay suara -->
  <iframe id="webAppFrame" src="" allow="autoplay; encrypted-media"></iframe>

  <script>
    const baseUrl = "https://script.google.com/macros/s/AKfycbw3t7nT9utUzl8YnynosSw8l9sjC6Of0lDao8_j259f4OwnwDFskZ_MOV5H376yY5mSFA/exec;
    const urlParams = window.location.search;
    document.getElementById("webAppFrame").src = baseUrl + urlParams;
  </script>

</body>
</html>
